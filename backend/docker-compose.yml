# Docker Compose for QuakeRoute Backend
services:
  # PostgreSQL with PostGIS
  db:
    image: postgis/postgis:16-3.4
    container_name: quakeroute-db
    environment:
      POSTGRES_DB: quantum_disaster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quakeroute-api
    environment:
      - APP_NAME=quantum-disaster-system
      - ENV=dev
      - HOST=0.0.0.0
      - PORT=8000
      - DB_HOST=db
      - DB_PORT=5433
      - DB_NAME=quantum_disaster
      - DB_USER=postgres
      - DB_PASSWORD=password
      - OSRM_BASE_URL=https://router.project-osrm.org
      - OVERPASS_URL=https://overpass-api.de/api/interpreter
      - RESOURCE_SEARCH_RADIUS_KM=15
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
